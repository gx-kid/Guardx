var CONFIG = {

    privacy:   "https://guardx.site/privacy",
    email:     "mailto:guardx.support@gmail.com"
  },
  emailAddress: "guardx.support@gmail.com",
  users: { base: 12400, startDate: "2026-01-01", perDay: 40 }
};
/* ======================================================================================= */

(function () {
  // links
  document.querySelectorAll("[data-link]").forEach(function (a) {
    a.href = CONFIG.links[a.getAttribute("data-link")] || "#";
  });
  document.getElementById("email-text").textContent = CONFIG.emailAddress;
  document.getElementById("yr").textContent = new Date().getFullYear();

  // tutorial video plays inside the page
  document.getElementById("tutorial").src =
    "https://www.youtube-nocookie.com/embed/" + CONFIG.youtubeVideoId + "?rel=0&modestbranding=1";

  // active users: grows on its own over time, no backend needed
  var el = document.getElementById("users"), shown = 0;
  function target() {
    var days = (Date.now() - new Date(CONFIG.users.startDate).getTime()) / 864e5;
    return Math.floor(CONFIG.users.base + Math.max(0, days) * CONFIG.users.perDay);
  }
  function render(n) { el.textContent = n.toLocaleString("en-US") + "+"; }
  function animate() {
    var end = target(), t0 = performance.now(), dur = 1400;
    function step(t) {
      var p = Math.min(1, (t - t0) / dur);
      shown = Math.round(end * (1 - Math.pow(1 - p, 3)));
      render(shown);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  var played = false;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (e, o) {
      if (e[0].isIntersecting && !played) { played = true; animate(); o.disconnect(); }
    }, { threshold: 0.4 }).observe(el);
  } else { render(target()); }
  setInterval(function () { if (played) render(target()); }, 60000);

  // extra polish: scroll progress, header shadow, back-to-top, reveal-on-scroll
  document.documentElement.classList.add("js");
  var prog = document.getElementById("prog"), hdr = document.querySelector("header"), up = document.getElementById("top-btn");
  function onScroll() {
    var h = document.documentElement, y = h.scrollTop, max = h.scrollHeight - h.clientHeight;
    prog.style.width = (max > 0 ? y / max * 100 : 0) + "%";
    hdr.classList.toggle("scrolled", y > 8);
    up.classList.toggle("show", y > 700);
  }
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();
  var targets = document.querySelectorAll("section h2, .lead, .video, .dl, .stats li, .ft li, .pkg, .steps li, .trouble, details");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    targets.forEach(function (t, i) {
      t.classList.add("rv");
      var sib = Array.prototype.indexOf.call(t.parentNode.children, t);
      t.style.setProperty("--d", Math.min(sib % 4, 3) * 0.07 + "s");
      io.observe(t);
    });
  } else { targets.forEach(function (t) { t.classList.add("in"); }); }
})();
</script>
</body>
</html>
