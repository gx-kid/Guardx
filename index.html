<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GX Parental Controller</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    background:#fff;
    color:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:720px;
    text-align:center;
    animation:fade .8s ease;
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    border:3px solid #000;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:34px;
    font-weight:700;
    margin-bottom:30px;
}

h1{
    font-size:clamp(2rem,5vw,3.8rem);
    margin-bottom:18px;
    letter-spacing:-1px;
}

p{
    font-size:clamp(1rem,2.3vw,1.2rem);
    line-height:1.8;
    color:#555;
    margin-bottom:35px;
}

.line{
    width:90px;
    height:4px;
    background:#000;
    margin:25px auto;
    border-radius:10px;
}

.footer{
    font-size:.95rem;
    color:#777;
}

.footer strong{
    color:#000;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:480px){

.logo{
    width:75px;
    height:75px;
    font-size:28px;
}

.container{
    padding:10px;
}

}
</style>

</head>
<body>

<div class="container">

<div class="logo">GX</div>

<h1>We Are Updating</h1>

<div class="line"></div>

<p>
The <strong>GX Parental Controller</strong> website is currently under maintenance.
We're working on exciting improvements to provide you with a better experience.
Please give us a little more time.
</p>

<div class="footer">
<strong>GX Parental Controller Team</strong>
</div>

</div>

</body>
</html>
